<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course</title>
    <link rel="stylesheet" href="course-page.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

</head>
<body>
    <div class="container">

        <div class="sidebar">
          <div class="top">
            <div class="btn">
              <img src="/Hackathon-Web3-2025/src/test_frontend/assets/logo biru.svg" alt="logo" id="logo-img"/>
            </div>
            <div class="expand-logo btn">
              <span class="logo-text">ИCourage</span>
              <img src="/Hackathon-Web3-2025/src/test_frontend/assets/back.svg" alt="">
            </div>
          </div>
        
          <ul>
            <div class="menu-items"> <!-- Tambahkan ini -->
              <li>
                <a href="/Hackathon-Web3-2025/src/test_frontend/dashboard/dashboard.html">
                  <img src="/Hackathon-Web3-2025/src/test_frontend/assets/dashboard (1).svg" alt="dashboard"/>
                  <span class="nav-item">Dashboard</span>
                </a>
              </li>
              <li>
                <a href="/Hackathon-Web3-2025/src/test_frontend/course-page/course-page.html">
                  <img src="/Hackathon-Web3-2025/src/test_frontend/assets/courses.svg" alt="courses"/>
                  <span class="nav-item">Courses</span>
                </a>
              </li>
              <li>
                <a href="/Hackathon-Web3-2025/src/test_frontend/achievements/achievement-page.html">
                  <img src="/Hackathon-Web3-2025/src/test_frontend/assets/achievements.svg" alt="achievements"/>
                  <span class="nav-item">Achievements</span>
                </a>
              </li>
            </div>
        
            <li class="logout"> <!-- Biarkan logout di luar .menu-items -->
              <a href="#" class="logout-btn">
                <img src="/Hackathon-Web3-2025/src/test_frontend/assets/logout.svg" alt="logout"/>
                <span class="nav-item">Logout</span>
              </a>
            </li>
          </ul>
        </div>
        
        <main class="main-content">
          <div class="header">
            <div class="header-icons">
              <div class="icon"><img src="/Hackathon-Web3-2025/src/test_frontend/assets/lonceng.svg" alt="lonceng" /></div>
              <div class="profile">
                <div class="profile-img"></div>
              </div>
            </div>
          </div> 

          <div class="course-header">
            <div>
              <form class="search-bar" onsubmit="handleSearch(event)">
                <i class="fa fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search courses..." />
              </form> 
            </div>           
  
            <div class="filter-buttons">
              <button id="exploreButton" class="active">Explore Courses</button>
              <button id="progressButton">In Progress</button>
            </div>
          </div>

          <div id="explore" class="course-section"> 
            <main id="exploreContainer" class="course-grid">
                <!-- Cards akan di-generate oleh JS -->
            </main>
          </div>

          <div id="progress" class="course-section">
            <h2>Continue where you left off...</h2>
            <main id="progressContainer" class="course-grid">
                <!-- Cards akan di-generate oleh JS -->
            </main>
          </div>
          
          
      
</body>
<script src="course-page.js"></script>
</html>
